# 模块 feature-plugin-admin（功能插件管理，系统侧基础数据）接口场景矩阵 manifest
# 维度定义见 docs/architecture/v2/03-testing.md §4。这是「系统管理员维护插件分类字典 /
# 插件主数据 / 参数模板四件套」的后台接口（权限码 feature_plugin.read / feature_plugin.write，
# migrations/000020 建表 + seed），与模块 15（游戏侧渠道实例插件配置，plugin.read/plugin.write，
# tests/backend/scenarios/feature-plugin.yaml）是两套完全独立的权限码与数据表，不可混用。
# 代码位置：services/admin-api/internal/{domain/plugin/feature_plugin_admin.go,
#   app/featureplugin, transport/http/featureplugin, infra/persistence/postgres/featureplugin_admin_*}。
#
# 运行说明（与 cashier-template.yaml/game.yaml 一致）：
#   进程内 httptest harness（无 POSTGRES_DSN/ADMIN_JWT_SECRET → ready=false）：
#     - requiresDB:false 的 S2 用例（受保护接口先过 Authn，未携带/无效令牌即 401）在沙箱内真实执行并断言。
#     - requiresDB:true 的用例需 PG + 全装配，进程内 harness 跳过，仅校验 manifest 可解析；
#       SCENARIO_WITH_DB=1 时由连库 harness（tests/fixtures/common/feature-plugin-admin.sql 提供
#       RBAC 角色 + 固定 id 9001-9004 的分类/插件/模板样本）执行。
#   这些维度已由进程内 L3 httptest（feature_plugin_http_test.go，内存仓储 + 真实 JWT/路由/中间件/
#   审计 spy）逐一硬断言覆盖；本 manifest 的连库用例是对同一套接口在真实 Postgres 上的等价验证。
#
# 单次性写用例（幂等边界，务必知悉）：create_category_success / create_plugin_success /
#   create_template_success / delete_category_success / delete_plugin_success /
#   delete_plugin_cascade_deletes_templates 六个用例会在真实库
#   产生「一次性」状态迁移（新建行 / 删除固定 fixture 行），二次针对同一持久化 DB 重跑会因
#   「已存在」或「已删除→404」而失败。这与仓库里其它模块（如 cashier-template.yaml 的
#   create_template_success/templateId=brand_new）同一约定：SCENARIO_WITH_DB=1 用例假定跑在
#   scripts/regression/run.sh 每次全新启停的 docker postgres 容器上，而非长期复用的开发库。
#   PATCH 类成功用例改为「绝对值赋值」（而非相对增量），天然可重复执行。
#
# 模块维度适用性矩阵（compact + 03-testing §4）：
#   - S6（跨 env）：本模块 3 张表（feature_plugin_categories/feature_plugins/feature_plugin_templates）
#     全部位于共享 schema platform，业务行无 env 列；读写恒落 platform，不随前端 env 切换、不跨 schema。
#     标注在若干只读用例上（复用同一 GET 请求，不额外产生写副作用）。
#   - S8（脱敏）：模板四件套的 secretFieldsJson 只登记「哪些 key 是敏感字段」，不存密文本身
#     （实际密文落在游戏侧渠道实例配置 game_channel_plugin_configs，属模块 15），故本模块 S8 = N/A。
#   - S9（分页）：分类字典体量小、全量返回不分页 → N/A；插件主数据 GET /feature-plugins 分页 → 覆盖。
#   - S10（事务回滚）：除 DELETE /feature-plugins/{pluginId} 外，写路径都是「预检查（读）+ 单条
#     INSERT/UPDATE/DELETE」在同一 InTx 内，没有可观察的「部分写入回滚」现象（预检查失败时单条写
#     从未发生，等价断言见 feature_plugin_http_test.go 的「冲突/校验失败不落库、不写审计」）。
#     插件删除是唯一的多语句写（先级联删模板、再删插件），必须整体回滚才不会留下「模板已清空但
#     插件还在」的半删状态；连库侧无法在单个 HTTP 请求里注入中途失败，故该断言由进程内
#     feature_plugin_http_test.go 的 TestDeleteFeaturePluginRollsBackCascade 覆盖 → 本 manifest N/A。
module: feature-plugin-admin
cases:
  # ═════════════════ 1) GET /feature-plugin-categories（feature_plugin.read，全量不分页）
  - name: list_categories_requires_auth
    dimension: S2
    requiresDB: false
    request:
      method: GET
      path: /api/admin/feature-plugin-categories
    expect:
      status: 401
      jsonContains: { error.code: UNAUTHENTICATED }
  - name: list_categories_forbidden
    dimension: S3
    requiresDB: true
    auth: { role: no_perm }
    note: "无任何权限 → 403 FORBIDDEN"
    request:
      method: GET
      path: /api/admin/feature-plugin-categories
    expect:
      status: 403
      jsonContains: { error.code: FORBIDDEN }
  - name: list_categories_success
    dimension: S1
    requiresDB: true
    auth: { role: feature_plugin_reader }
    fixture: common/feature-plugin-admin/base
    note: "200 + 统一包络 { items[] }；字典体量小不分页"
    request:
      method: GET
      path: /api/admin/feature-plugin-categories
    expect:
      status: 200
  - name: list_categories_invalid_enabled
    dimension: S4
    requiresDB: true
    auth: { role: feature_plugin_reader }
    note: "enabled 非布尔 → 400 VALIDATION_FAILED"
    request:
      method: GET
      path: /api/admin/feature-plugin-categories?enabled=maybe
    expect:
      status: 400
      jsonContains: { error.code: VALIDATION_FAILED }
  - name: list_categories_platform_schema
    dimension: S6
    requiresDB: true
    auth: { role: feature_plugin_reader }
    note: "平台级：读 platform schema（search_path 决定），不随前端 env 切换、不跨 schema"
    request:
      method: GET
      path: /api/admin/feature-plugin-categories
    expect:
      status: 200

